name: Quality & Live Preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript and Vite build
        run: npm run check

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install backend and test dependencies
        run: pip install -r requirements-dev.txt

      - name: API tests
        run: python -m pytest -q

      - name: S0 baseline contract
        run: python scripts/check_marsad_baseline.py

      - name: S1 Supabase foundation contract
        run: python scripts/check_supabase_foundation.py

      - name: S2-A PostgreSQL schema design freeze
        run: python scripts/check_supabase_schema_freeze.py

      - name: S2-B1 core identity and tenancy migration
        run: python scripts/check_supabase_s2_b1.py

      - name: S2-B2 teachers domain migration
        run: python scripts/check_supabase_s2_b2.py

      - name: S2-B3 operational domains migration
        run: python scripts/check_supabase_s2_b3.py

      - name: S2-B4 content and intake domains migration
        run: python scripts/check_supabase_s2_b4.py

      - name: S2-B5 final schema closure
        run: python scripts/check_supabase_s2_b5.py

      - name: S2-B5 Fix 1 updated_at clock
        run: python scripts/check_supabase_s2_b5_fix1.py

      - name: S2-C1 Auth and RLS security foundation
        run: python scripts/check_supabase_s2_c1.py

      - name: S2-C2 domain RLS baseline
        run: python scripts/check_supabase_s2_c2.py

      - name: S2-D database acceptance and migration readiness
        run: python scripts/check_supabase_s2_d.py

      - name: S2-D Fix 1 acceptance fixture cleanup
        run: python scripts/check_supabase_s2_d_fix1.py

      - name: S2-E1 SQLite migration compiler dry-run tooling
        run: python scripts/check_supabase_s2_e1.py

      - name: S2-E1B representative legacy dry-run pack
        run: python scripts/check_supabase_s2_e1b.py

      - name: S2-E2 production tenant bootstrap contract
        run: python scripts/check_supabase_s2_e2.py

      - name: S3-A Auth and tenant session foundation
        run: python scripts/check_supabase_s3_a.py

      - name: S3-B1 teachers read repository and parity gate
        run: python scripts/check_supabase_s3_b1.py

      - name: S3-B2 teachers write repository and RLS acceptance
        run: python scripts/check_supabase_s3_b2.py

      - name: S3-B2R1 teacher write ambiguity correction
        run: python scripts/check_supabase_s3_b2_r1.py

      - name: S3-B3 teachers UI cutover
        run: python scripts/check_supabase_s3_b3.py

      - name: S3-C1 teacher-related Supabase read boundary
        run: python scripts/check_supabase_s3_c1.py

      - name: S3-C2 supervision read/write cutover
        run: python scripts/check_supabase_s3_c2.py

      - name: S3-C3A requests/documents review cutover
        run: python scripts/check_supabase_s3_c3a.py

      - name: S3-C3B public intake and private Storage
        run: python scripts/check_supabase_s3_c3b.py

      - name: S3-C3B R1 GitHub Pages public upload routing
        run: python scripts/check_supabase_s3_c3b_r1.py

      - name: S3-C3B R2 browser-to-Edge CORS correction
        run: python scripts/check_supabase_s3_c3b_r2.py

      - name: Real HTTP E2E regression
        run: python scripts/marsad_e2e_regression.py

  build-preview:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Build GitHub Pages preview
        env:
          VITE_PREVIEW_MODE: 'true'
          VITE_BASE_PATH: '/marsad-alinjazat/'
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_SESSION_MODE: 'diagnostic'
          VITE_TEACHERS_DATA_MODE: 'supabase'
          VITE_SUPERVISION_DATA_MODE: 'supabase'
          VITE_REQUESTS_DOCUMENTS_DATA_MODE: 'supabase'
        run: |
          npm run build:pages
          touch dist/.nojekyll
          cp dist/index.html dist/404.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy-preview:
    needs: build-preview
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
